<div class="ui-settings-stack">

<section class="ui-settings-group"><h2>等宽居中统计</h2><div class="surface ui-metrics"><span><strong>14</strong><small>完成任务</small></span><span><strong>12</strong><small>习惯打卡</small></span><span><strong>5</strong><small>记录</small></span></div></section>
