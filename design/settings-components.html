<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置组件固定样例</title>
<link rel="stylesheet" href="../src/styles.css">
<link rel="stylesheet" href="../src/design-system.css">
<main class="page">
  <header class="ui-titlebar"><h1 class="ui-page-title">设置组件样例</h1></header>
  <p class="caption">组间 16px · 标题到内容 8px · 行高至少 50px · 内边距 8×12px</p>
  <div class="ui-settings-stack">
    <section class="ui-settings-group">
      <h3 class="ui-settings-group-title">服务信息</h3>
      <div class="ai-service-info">
        <div class="setting-row-text ai-info-row"><span>◇</span><strong>服务方</strong><span class="ai-info-value">MiniMax</span><span>›</span></div>
        <div class="setting-row-text ai-info-row"><span>◇</span><strong>连接状态</strong><span class="ai-info-value">可用</span><span>›</span></div>
        <button class="button button-secondary">重新检查连接</button>
      </div>
    </section>
    <section class="ui-settings-group">
      <h3 class="ui-settings-group-title">默认发送范围</h3>
      <div class="ai-scope-summary">
        <div class="setting-row-text ai-info-row"><span>◇</span><strong>每日整理</strong><span class="ai-info-value">每次确认</span><span>›</span></div>
        <div class="setting-row-text ai-info-row"><span>◇</span><strong>周回顾</strong><span class="ai-info-value">摘要，不含日记原文</span><span>›</span></div>
      </div>
    </section>
    <section class="ui-settings-group">
      <h3 class="ui-settings-group-title">本地存储</h3>
      <div class="ui-settings-stack">
        <div class="ui-setting-card ui-storage-status"><span class="ui-storage-status-icon" aria-hidden="true">✓</span><div class="ui-navigation-copy"><strong>状态正常</strong><span class="caption">记录保存在此设备。</span></div></div>
        <div class="ui-navigation-list">
          <div class="ui-navigation-row ui-setting-value"><span>记录</span><span class="caption">0 条</span></div>
          <div class="ui-navigation-row ui-setting-value"><span>图片</span><span class="caption">0 张</span></div>
          <div class="ui-navigation-row ui-setting-value"><span>最近备份</span><span class="caption">尚未备份</span></div>
        </div>
        <aside class="ui-setting-card ui-storage-warning"><span aria-hidden="true">△</span><p>清除本站数据会删除本机内容。</p></aside>
      </div>
    </section>
    <section class="ui-settings-group">
      <h3 class="ui-settings-group-title">显示与语气</h3>
      <div class="ui-settings-stack">
        <label class="ui-setting-card ui-setting-value"><span>减少动态效果</span><input type="checkbox" role="switch" class="ui-switch" checked></label>
        <div class="ui-setting-card ui-setting-value"><span>指导语气</span><div class="ui-segmented ui-tone-options" role="group" aria-label="指导语气"><button class="ui-segmented-item" aria-pressed="true" onclick="this.setAttribute('aria-pressed','true');this.nextElementSibling.setAttribute('aria-pressed','false')">温和</button><button class="ui-segmented-item" aria-pressed="false" onclick="this.setAttribute('aria-pressed','true');this.previousElementSibling.setAttribute('aria-pressed','false')">直接</button></div></div>
      </div>
    </section>
  </div>
</main>
</html>
